services:
  taskd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskd
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - taskd_data:/data
    environment:
      - PORT=8000
      - DATA_DIR=/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  taskd_data:
    driver: local
